<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>Marvit&Finances • Gestão Orçamentária & Liberdade Financeira</title>
    <meta
      name="description"
      content="Planejamento orçamentário por pilares, Potes dos Sonhos, Simulador FIRE e Cofre Biométrico na nuvem com estética Cozy Kitchen."
    />

    <!-- PWA & Mobile Capable Meta Tags (iOS & Android) -->
    <meta name="theme-color" content="#FAF6F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Marvit&Finances" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/marvit-logo.png" />
    <link rel="apple-touch-icon" href="/assets/marvit-logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans, Fraunces (Editorial Cozy) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!-- PDF.js para Leitura Segura de Faturas de Cartão (Banco Inter, Nubank, etc.) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
  </head>
  <body class="bg-oat-100 text-espresso-900 antialiased selection:bg-maldives-500/20 selection:text-maldives-800">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
